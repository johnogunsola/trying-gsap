    </filter>
  </defs>
  <path fill="url(#red)" filter="url(#bevel)" d="M38 20h70L88 40H46L32 54h50L62 74H8l10-34 20-20Zm28 34h54l-10 34-20 20H20l20-20h42l14-14H46l20-20Z"/>
